<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSOLA V3.1 - FULL ESCALABLE</title>
    <style>
        /* Mantenemos tu estilo original que es muy limpio */
        body { background-color: #0c0c0c; color: #e0e0e0; font-family: sans-serif; padding: 15px; margin: 0; }
        h1 { color: #ffd700; text-align: center; font-size: 1.2rem; text-transform: uppercase; border-bottom: 2px solid #ffd700; padding: 15px 0; margin: 0; }
        .bloque { background: #1a1a1a; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #ffd700; }
        label { display: block; margin-top: 8px; font-weight: bold; color: #ffd700; font-size: 0.8rem; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-file { background: #333; color: #ffd700; border: 1px solid #ffd700; padding: 12px; width: 100%; border-radius: 5px; text-align: center; font-size: 0.8rem; display: block; margin-top: 5px; font-weight: bold; cursor: pointer; }
        .info-peso { font-size: 0.7rem; margin-top: 5px; font-weight: bold; }
        .peso-ok { color: #00ff88; }
        .peso-alerta { color: #ff4444; }
        .preview { height: 60px; margin-top: 10px; border-radius: 5px; display: none; border: 1px solid #444; }
        
        .tramo-card { background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; position: relative; }
        .btn-remove { position: absolute; top: 5px; right: 5px; color: #ff4444; background: none; border: none; font-weight: bold; cursor: pointer; }
        .row { display: flex; gap: 8px; margin-bottom: 5px; }
        .btn-plus { background: #238636; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        .btn-generar { background: #ffd700; color: black; border: none; padding: 20px; width: 100%; font-weight: bold; border-radius: 5px; margin-top: 20px; font-size: 1rem; cursor: pointer; }
        .btn-copiar { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        
        pre { background: #000; padding: 15px; border: 1px solid #ffd700; font-size: 0.7rem; overflow-x: auto; color: #00ff88; border-radius: 5px; white-space: pre-wrap; word-break: break-all; margin-top: 15px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <h1>🚀 Constructor Satelital V3.1</h1>

    <div class="bloque">
        <label>Identidad Visual (Base64)</label>
        <label for="file-logo" class="btn-file">📸 LOGO PERFIL</label>
        <input type="file" id="file-logo" accept="image/*" onchange="procesarImg(this, 'prev-logo', 'data-logo', 'p-logo')">
        <div id="p-logo" class="info-peso"></div>
        <img id="prev-logo" class="preview">
        <input type="hidden" id="data-logo">

        <label for="file-banner" class="btn-file" style="margin-top:15px;">🖼️ BANNER FONDO</label>
        <input type="file" id="file-banner" accept="image/*" onchange="procesarImg(this, 'prev-banner', 'data-banner', 'p-banner')">
        <div id="p-banner" class="info-peso"></div>
        <img id="prev-banner" class="preview">
        <input type="hidden" id="data-banner">
    </div>

    <div class="bloque">
        <label>Textos y Marca</label>
        <input type="text" id="nombre" placeholder="Nombre del Profesional">
        <input type="color" id="color" value="#ffd700" style="height:45px;">
        <textarea id="bio" placeholder="Bio y especialidad..." rows="2"></textarea>
    </div>

    <div class="bloque">
        <label>Logística y Seguridad</label>
        <div class="row">
            <input type="number" id="tanque" placeholder="Minutos Tanque">
            <input type="text" id="pin" placeholder="PIN Dueño (Ej: 1234)">
        </div>
        <input type="text" id="idSala" placeholder="ID de Jitsi (Ej: sala-marcos-123)">
        <input type="text" id="wa_colab" placeholder="WhatsApp Colab (549...)">
    </div>

    <div class="bloque">
        <label>Productos y Tramos</label>
        <div id="lista-tramos"></div>
        <button class="btn-plus" onclick="addTramo()">➕ AÑADIR PRODUCTO</button>
    </div>

    <button class="btn-generar" onclick="generar()">GENERAR ADN FINAL</button>

    <div id="res" style="display:none; padding-bottom: 40px;">
        <button class="btn-copiar" onclick="copiarJSON()">📋 COPIAR ADN AL PORTAPAPELES</button>
        <pre id="json-output"></pre>
    </div>

    <script>
        function procesarImg(input, prev, hide, peso) {
            const file = input.files[0];
            const reader = new FileReader();
            if (file) {
                const kb = (file.size/1024).toFixed(1);
                const info = document.getElementById(peso);
                info.innerHTML = kb > 400 ? `⚠️ ${kb}KB (Pesado)` : `✅ ${kb}KB (OK)`;
                info.className = kb > 400 ? "info-peso peso-alerta" : "info-peso peso-ok";
                
                reader.onloadend = () => {
                    document.getElementById(prev).src = reader.result;
                    document.getElementById(prev).style.display = "block";
                    document.getElementById(hide).value = reader.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function addTramo(d = {}) {
            const container = document.getElementById('lista-tramos');
            const div = document.createElement('div');
            div.className = 'tramo-card';
            div.innerHTML = `
                <button class="btn-remove" onclick="this.parentElement.remove()">X</button>
                <div class="row">
                    <input type="number" class="t-min" placeholder="Minutos" value="${d.min||''}">
                    <input type="text" class="t-pre" placeholder="Precio $" value="${d.precio||''}">
                </div>
                <input type="text" class="t-mp" placeholder="Link Mercado Pago" value="${d.mp||''}">
            `;
            container.appendChild(div);
        }

        function generar() {
            // Validamos campos mínimos
            const pin = document.getElementById('pin').value;
            if(!pin) { alert("Por favor, define un PIN de seguridad"); return; }

            const tramos = Array.from(document.querySelectorAll('.tramo-card')).map(t => ({
                min: parseInt(t.querySelector('.t-min').value) || 0,
                precio: t.querySelector('.t-pre').value || "0",
                mp: t.querySelector('.t-mp').value || "#"
            }));

            const data = {
                nombreMarca: document.getElementById('nombre').value || "Sin Nombre",
                colorMarca: document.getElementById('color').value,
                logoUrl: document.getElementById('data-logo').value,
                bannerUrl: document.getElementById('data-banner').value,
                bioTexto: document.getElementById('bio').value,
                tanqueMinutos: parseInt(document.getElementById('tanque').value) || 0,
                idSala: document.getElementById('idSala').value || "sala-predeterminada",
                pinSeguridad: pin,
                whatsappColaborador: document.getElementById('wa_colab').value,
                tramos: tramos
            };

            const jsonStr = JSON.stringify(data, null, 2);
            document.getElementById('json-output').innerText = jsonStr;
            document.getElementById('res').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }

        function copiarJSON() {
            const texto = document.getElementById('json-output').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                alert("¡ADN copiado! Pégalo en tu archivo config.json");
            });
        }
        
        // Iniciar con un tramo por defecto
        addTramo({min: "15", precio: "2500"});
    </script>
</body>
        </html>
